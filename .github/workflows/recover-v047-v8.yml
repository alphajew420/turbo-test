name: Recover tagged V8 dependency

on:
  workflow_dispatch:
    inputs:
      expected_publisher_sha:
        description: Exact reviewed main commit containing this recovery workflow
        required: true
        type: string
      confirmation:
        description: Enter publish-reviewed-v8-149.3.0-for-v0.4.7
        required: true
        type: string

permissions:
  contents: read

jobs:
  recover-v8:
    if: github.repository == 'miaskiewicz/turbo-test' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TURBO_TEST_RECOVERY_PUBLISHER_SHA: ${{ inputs.expected_publisher_sha }}
      TURBO_TEST_RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require the reviewed publisher commit and explicit operation
        run: |
          python3 - <<'PY'
          import os, re
          expected = os.environ['TURBO_TEST_RECOVERY_PUBLISHER_SHA']
          assert re.fullmatch('[0-9a-f]{40}', expected)
          assert os.environ['GITHUB_SHA'] == expected
          assert os.environ['TURBO_TEST_RECOVERY_CONFIRMATION'] == 'publish-reviewed-v8-149.3.0-for-v0.4.7'
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: publisher
      - uses: actions/checkout@v4
        with:
          ref: e178d4bc132bb6bc158d3d2bedf62891fe8c1c00
          path: tagged-source
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the immutable source and tag before preparing any package
        run: |
          python3 -B - <<'PY'
          import importlib.util, os
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          spec = importlib.util.spec_from_file_location('release_v8', workspace / 'publisher/vendor/release-rusty-v8.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.verify_publish_context(workspace / 'tagged-source/vendor', True)
          PY
      - name: Reproduce all immutable fork sources from the licensed archive
        working-directory: tagged-source
        run: |
          curl --fail --location --retry 3 https://static.crates.io/crates/v8/v8-149.3.0.crate -o "$RUNNER_TEMP/upstream-v8-149.3.0.crate"
          python3 -B vendor/update-rusty-v8.py --archive "$RUNNER_TEMP/upstream-v8-149.3.0.crate" --check
      - name: Test publisher failure and source guards
        run: python3 -B publisher/vendor/test_release_rusty_v8.py
      - name: Publish or verify only the exact tagged V8 dependency
        run: >-
          python3 -B publisher/vendor/release-rusty-v8.py
          --source-root "$GITHUB_WORKSPACE/tagged-source/vendor"
          --recover-v047 --publish --out "$RUNNER_TEMP/recovered-v8"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v047-v8-recovery-proof
          path: |
            ${{ runner.temp }}/recovered-v8/receipt.json
            ${{ runner.temp }}/recovered-v8/package.log
            ${{ runner.temp }}/recovered-v8/target/package/turbo-surf-v8-149.3.0.crate
          if-no-files-found: ignore
